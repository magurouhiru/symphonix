services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:22
    container_name: symphonix-dev
    command: sleep infinity
    volumes:
      - ..:/workspaces/symphonix
      # node_modules はホストと共有せずボリュームに置く（Windows とのファイル共有は遅いため）
      - node_modules:/workspaces/symphonix/node_modules
    environment:
      AI_BASE_URL: http://localai:8080/v1
      MODEL: gemma-4-e4b-it-qat-q4_0
      IMAGE_MODEL: sd-1.5-ggml
      STT_MODEL: whisper-small
      TTS_MODEL: supertonic-3

  # 文章と画像の生成をまとめて受け持つ OpenAI 互換サーバー
  localai:
    image: localai/localai:latest-gpu-nvidia-cuda-12
    container_name: symphonix-localai
    # モデルは symphonix が起動後に LocalAI のギャラリーから取得させる（/status で進み具合を確認できる）
    ports:
      - 8080:8080
    environment:
      MODELS_PATH: /models
      # VRAM 8GB に収めるため、同時に読み込むモデルは 1 つだけにする
      LOCALAI_MAX_ACTIVE_BACKENDS: 1
      LOCALAI_CONTEXT_SIZE: 16384
    volumes:
      - models:/models
      - backends:/backends
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  node_modules:
  models:
  backends:
